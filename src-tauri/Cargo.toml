[package]
name = "habit-tracker"
version = "0.1.0"
description = "Offline desktop habit tracker"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "habit_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "habit-tracker"
path = "src/main.rs"
windows_subsystem = "windows"
