[package]
name = "habit-tracker"
version = "0.1.0"
description = "Offline desktop habit tracker"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation"] }

[lib]
name = "habit_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "habit-tracker"
path = "src/main.rs"
windows_subsystem = "windows"
